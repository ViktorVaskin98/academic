name: Публикация конспекта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Юнит-тесты
        run: npm test

      - name: Пересобрать бандл и индексы
        run: npm run build

      - name: Проверить, что закоммиченная сборка совпадает с исходниками
        run: |
          if ! git diff --exit-code -- conspect/assets/bundle.js conspect/assets/search-index.js conspect/assets/search-index.json conspect/assets/cheatsheet-data.js; then
            echo "::error::Сборка разошлась с исходниками. Запусти 'npm run build' и закоммить результат."
            exit 1
          fi

      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp -r conspect data _site/
          cp index.html _site/index.html
          touch _site/.nojekyll
          rm -rf _site/conspect/manim/media _site/conspect/tests _site/conspect/tools
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
